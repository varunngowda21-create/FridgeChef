services:
  db:
    image: postgres:16-alpine
    container_name: fridgechef-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fridgechef}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fridgechef}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fridgechef-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: fridgechef-api:latest
    container_name: fridgechef-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fridgechef}
      UPLOAD_DIR: /var/lib/fridgechef/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
    volumes:
      - uploads_data:/var/lib/fridgechef/uploads
    ports:
      - "${API_PORT_BINDING:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fridgechef-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: fridgechef-web:latest
    container_name: fridgechef-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
      - "${DEV_PORT_BINDING:-127.0.0.1:5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fridgechef-network

volumes:
  postgres_data:
    name: fridgechef_postgres_data
  uploads_data:
    name: fridgechef_uploads_data

networks:
  fridgechef-network:
    name: fridgechef_network
    driver: bridge
