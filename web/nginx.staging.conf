# ==============================================================================
# FridgeChef AI — Staging Nginx Reverse Proxy Configuration
# PRD Reference: Section 12.5, Section 15.1, Section 15.3
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Trusted proxy network definition (Loopback, Docker bridge, RFC 1918 subnets)
    geo $trusted_proxy {
        default          0;
        127.0.0.1/32     1;
        10.0.0.0/8       1;
        172.16.0.0/12    1;
        192.168.0.0/16   1;
    }

    # Anti-spoofing map: Only trust incoming X-Forwarded-Proto from verified proxies
    map "$trusted_proxy:$http_x_forwarded_proto" $proxy_x_forwarded_proto {
        "1:https" https;
        "1:http"  http;
        default   $scheme;
    }

    # Real IP module configuration
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ==========================================================================
    # HTTP Server: Port 80
    # Handles ACME challenges and enforces permanent HTTP -> HTTPS redirection
    # ==========================================================================
    server {
        listen 80;
        server_name staging.fridgechef.com localhost;

        # Let's Encrypt / Certbot ACME HTTP-01 challenge response
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # If incoming request is already HTTPS via trusted edge proxy (ALB / Cloudflare),
        # do NOT redirect; serve traffic directly via internal locations below.
        # Otherwise, redirect all plain HTTP requests permanently to HTTPS.
        location / {
            if ($proxy_x_forwarded_proto = "http") {
                return 301 https://$host$request_uri;
            }

            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API Proxy for edge TLS termination (Cloudflare / ALB forwarding to port 80)
        location /api {
            if ($proxy_x_forwarded_proto = "http") {
                return 301 https://$host$request_uri;
            }

            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Request-ID $http_x_request_id;
            client_max_body_size 10M;
        }
    }

    # ==========================================================================
    # HTTPS Server: Port 443 (Direct Host TLS Termination)
    # Active when TLS certificates are provisioned on the host
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.fridgechef.com;

        # TLS Certificate paths (mounted from host or Let's Encrypt volume)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS Protocols & Cipher Suites (Modern Security Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Enforced over HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10M;

        # Reverse Proxy to API backend service
        location /api {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # PWA Service Worker & Manifest: Never cache
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache-busting for hashed static assets
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA Routing: Fall back to index.html
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

